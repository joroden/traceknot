name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version
        id: version
        run: |
          tag=$(scripts/release/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: ui/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: make dist
        run: make dist

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Generate GitHub build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/downloads/traceknot-*"

      - name: Publish release files to R2
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone copy dist/downloads/ "r2:$R2_BUCKET/releases/$TAG/downloads/" \
            --no-traverse
          rclone copy dist/ "r2:$R2_BUCKET/" \
            --no-traverse \
            --include "install.sh" --include "install.ps1"
          printf '%s' "$TAG" > dist/latest.txt
          rclone copyto dist/latest.txt "r2:$R2_BUCKET/latest.txt" --ignore-times

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="Release $TAG" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$tag_sha" >/dev/null

      - name: Create GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/create-github-release.sh "$TAG"
